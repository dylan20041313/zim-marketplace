<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZimMarket & Product Reviews</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Desktop vs Mobile reel height adjustment */
    .reel-container { 
      scroll-snap-type: y mandatory; 
      overflow-y: scroll; 
      height: 70vh; 
    }
    .reel-card { 
      scroll-snap-align: start; 
      height: 70vh; 
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">

  <!-- ================= TOP NAVIGATION BAR (Responsive for Phone/Tablet/Desktop) ================= -->
  <nav class="bg-black text-white p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-3">
      
      <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
        <span class="text-xl font-bold tracking-wide text-amber-400">ZimMarket</span>
        <span id="active-portal-badge" class="bg-indigo-600 text-xs px-2.5 py-1 rounded font-bold uppercase tracking-wider">Marketplace</span>
      </div>
      
      <!-- Responsive Portal Switcher Buttons -->
      <div class="flex flex-wrap items-center justify-center gap-2 w-full md:w-auto">
        <button onclick="switchMainPortal('marketplace')" id="btn-portal-market" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
          🛒 Marketplace Portal
        </button>
        <button onclick="switchMainPortal('reviews')" id="btn-portal-reviews" class="bg-gray-800 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
          ⭐ Product Reviews Portal
        </button>
        <button onclick="switchMainPortal('seller')" id="btn-portal-seller" class="bg-amber-500 text-black px-3 py-1.5 rounded-lg text-xs font-bold transition">
          🏪 Seller Studio
        </button>
      </div>

    </div>
  </nav>

  <!-- ================= MAIN CONTAINER (Adapts across Mobile, Tablet, Desktop) ================= -->
  <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">

    <!-- 1. MARKETPLACE PORTAL -->
    <section id="portal-marketplace" class="space-y-6">
      
      <!-- Filters (1 col on phone, 3 cols on desktop) -->
      <div class="bg-white p-4 rounded-xl shadow-sm grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="text" id="search-input" onkeyup="applyFilters()" placeholder="🔍 Search marketplace..." class="p-2 border rounded-lg text-xs bg-gray-50">
        <select id="category-filter" onchange="applyFilters()" class="p-2 border rounded-lg text-xs bg-gray-50">
          <option value="">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Fashion">Fashion & Apparel</option>
          <option value="Solar">Solar & Power</option>
          <option value="Vehicles">Vehicles & Parts</option>
        </select>
        <select id="location-filter" onchange="applyFilters()" class="p-2 border rounded-lg text-xs bg-gray-50">
          <option value="">All Locations</option>
          <option value="Harare">Harare</option>
          <option value="Bulawayo">Bulawayo</option>
          <option value="Gweru">Gweru</option>
          <option value="Mutare">Mutare</option>
        </select>
      </div>

      <!-- Responsive Grid: Phone = 1 Reel Column, Tablet = 2 Columns, Desktop = 3 Columns -->
      <div id="reels-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="p-8 text-center text-gray-500 col-span-full">Loading listings...</div>
      </div>
    </section>


    <!-- 2. REVIEWS PORTAL -->
    <section id="portal-reviews" class="hidden space-y-6">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Post Review Form (1 Column) -->
        <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
          <h3 class="font-bold text-lg text-indigo-900 border-b pb-2">Leave a Product Review</h3>
          <form onsubmit="submitReview(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1">Product Name</label>
              <input type="text" id="rev-product" placeholder="e.g. 450W Solar Panel" required class="w-full p-2 border rounded text-xs bg-gray-50">
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Your Name / Alias</label>
              <input type="text" id="rev-name" placeholder="e.g. Alex M." required class="w-full p-2 border rounded text-xs bg-gray-50">
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Rating</label>
              <select id="rev-rating" class="w-full p-2 border rounded text-xs bg-gray-50">
                <option value="5">⭐⭐⭐⭐⭐ (5/5 Excellent)</option>
                <option value="4">⭐⭐⭐⭐ (4/5 Good)</option>
                <option value="3">⭐⭐⭐ (3/5 Average)</option>
                <option value="2">⭐⭐ (2/5 Poor)</option>
                <option value="1">⭐ (1/5 Terible)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Detailed Feedback</label>
              <textarea id="rev-text" rows="3" placeholder="Write your experience..." required class="w-full p-2 border rounded text-xs bg-gray-50"></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded text-xs shadow">
              Publish Review
            </button>
          </form>
        </div>

        <!-- Live Review Feed (2 Columns on Desktop, 1 on Mobile) -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm space-y-4">
          <h3 class="font-bold text-lg text-indigo-900 border-b pb-2">Community Reviews & Experiences</h3>
          <div id="reviews-feed-list" class="space-y-3">
            <p class="text-xs text-gray-400">Loading buyer reviews...</p>
          </div>
        </div>

      </div>
    </section>


    <!-- 3. SELLER STUDIO PORTAL -->
    <section id="portal-seller" class="hidden bg-white p-6 rounded-xl shadow-sm max-w-2xl mx-auto space-y-4">
      <h2 class="text-xl font-bold border-b pb-2">Seller Studio</h2>
      <form onsubmit="handleSellerUpload(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold mb-1">Product Title</label>
          <input type="text" id="prod-title" required class="w-full p-2 border rounded text-xs">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Price ($ USD)</label>
            <input type="number" id="prod-price" required class="w-full p-2 border rounded text-xs">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Category</label>
            <select id="prod-category" class="w-full p-2 border rounded text-xs bg-gray-50">
              <option value="Electronics">Electronics</option>
              <option value="Fashion">Fashion & Apparel</option>
              <option value="Solar">Solar & Power</option>
              <option value="Vehicles">Vehicles & Parts</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-amber-500 text-black font-bold py-2 rounded text-xs">Publish Item</button>
      </form>
    </section>

  </div>

  <script>
    const SUPABASE_URL = "https://kuvorxkuyijvntyrsdks.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allProducts = [];

    // Switch between Marketplace, Reviews, and Seller portals
    function switchMainPortal(portal) {
      document.getElementById('portal-marketplace').classList.add('hidden');
      document.getElementById('portal-reviews').classList.add('hidden');
      document.getElementById('portal-seller').classList.add('hidden');

      document.getElementById('btn-portal-market').className = "bg-gray-800 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition";
      document.getElementById('btn-portal-reviews').className = "bg-gray-800 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition";
      document.getElementById('btn-portal-seller').className = "bg-gray-800 text-gray-300 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition";

      const badge = document.getElementById('active-portal-badge');

      if (portal === 'marketplace') {
        document.getElementById('portal-marketplace').classList.remove('hidden');
        document.getElementById('btn-portal-market').className = "bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition";
        badge.innerText = "Marketplace";
        badge.className = "bg-indigo-600 text-white text-xs px-2.5 py-1 rounded font-bold uppercase tracking-wider";
        loadProducts();
      } else if (portal === 'reviews') {
        document.getElementById('portal-reviews').classList.remove('hidden');
        document.getElementById('btn-portal-reviews').className = "bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition";
        badge.innerText = "Reviews Portal";
        badge.className = "bg-purple-600 text-white text-xs px-2.5 py-1 rounded font-bold uppercase tracking-wider";
        loadReviews();
      } else if (portal === 'seller') {
        document.getElementById('portal-seller').classList.remove('hidden');
        document.getElementById('btn-portal-seller').className = "bg-amber-500 text-black px-3 py-1.5 rounded-lg text-xs font-bold transition";
        badge.innerText = "Seller Studio";
        badge.className = "bg-amber-500 text-black text-xs px-2.5 py-1 rounded font-bold uppercase tracking-wider";
      }
    }

    // Load & Render Products
    async function loadProducts() {
      const { data, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
      if (!error && data) {
        allProducts = data;
        renderProducts(allProducts);
      }
    }

    function renderProducts(items) {
      const feed = document.getElementById('reels-feed');
      if (!items || items.length === 0) {
        feed.innerHTML = `<div class="p-8 text-center text-gray-400 col-span-full">No products found.</div>`;
        return;
      }

      feed.innerHTML = items.map(item => `
        <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between">
          <div class="h-48 bg-gray-200 relative">
            ${item.video_url 
              ? `<video class="w-full h-full object-cover" controls src="${item.video_url}"></video>`
              : `<img class="w-full h-full object-cover" src="${item.image_url || 'https://via.placeholder.com/300'}" alt="${item.title}">`
            }
            <span class="absolute top-2 right-2 bg-black/70 text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded">${item.category || 'General'}</span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
            <div>
              <h4 class="font-bold text-gray-900 text-sm">${item.title}</h4>
              <p class="text-xs text-gray-500">${item.location || 'Harare'}</p>
            </div>
            <div class="flex justify-between items-center pt-2 border-t">
              <span class="text-amber-600 font-extrabold text-sm">$${item.price} USD</span>
              <button class="bg-green-600 hover:bg-green-500 text-white font-bold px-3 py-1.5 rounded text-xs">Buy / Negotiate</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Filter Logic
    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const cat = document.getElementById('category-filter').value;
      const loc = document.getElementById('location-filter').value;

      const filtered = allProducts.filter(p => {
        return (p.title ? p.title.toLowerCase().includes(q) : true) &&
               (cat ? p.category === cat : true) &&
               (loc ? p.location === loc : true);
      });
      renderProducts(filtered);
    }

    // Reviews Portal Logic
    async function loadReviews() {
      const { data, error } = await supabaseClient.from('reviews').select('*').order('created_at', { ascending: false });
      const feed = document.getElementById('reviews-feed-list');
      
      if (error || !data || data.length === 0) {
        feed.innerHTML = `<p class="text-xs text-gray-400">No reviews published yet. Be the first!</p>`;
        return;
      }

      feed.innerHTML = data.map(r => `
        <div class="p-4 border rounded-xl bg-gray-50 space-y-1">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-gray-900 text-xs">${r.product_name}</h4>
            <span class="text-amber-500 text-xs">${'⭐'.repeat(r.rating)}</span>
          </div>
          <p class="text-gray-600 text-xs">${r.review_text}</p>
          <span class="text-[10px] text-gray-400 block pt-1">— Reviewed by ${r.reviewer_name}</span>
        </div>
      `).join('');
    }

    async function submitReview(e) {
      e.preventDefault();
      const product_name = document.getElementById('rev-product').value;
      const reviewer_name = document.getElementById('rev-name').value;
      const rating = parseInt(document.getElementById('rev-rating').value);
      const review_text = document.getElementById('rev-text').value;

      const { error } = await supabaseClient.from('reviews').insert([{ product_name, reviewer_name, rating, review_text }]);

      if (error) {
        alert("Failed to submit review: " + error.message);
      } else {
        alert("Review published!");
        document.getElementById('rev-product').value = '';
        document.getElementById('rev-text').value = '';
        loadReviews();
      }
    }

    loadProducts();
  </script>
</body>
</html>
