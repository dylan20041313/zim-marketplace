<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZimMarketplace - Live Video Commerce</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .reel-container { scroll-snap-type: y mandatory; overflow-y: scroll; height: 80vh; }
    .reel-card { scroll-snap-align: start; height: 80vh; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

  <!-- Navigation -->
  <nav class="bg-black text-white p-4 flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-xl font-bold tracking-wide">ZimMarket</h1>
    <div class="space-x-4">
      <button onclick="switchTab('reels')" class="hover:text-amber-400 font-medium">Reels Feed</button>
      <button onclick="switchTab('pricing')" class="hover:text-amber-400 font-medium">Subscriptions</button>
    </div>
  </nav>

  <!-- Section 1: Dynamic Shoppable Reels -->
  <section id="reels-section" class="max-w-md mx-auto my-4">
    <h2 class="text-lg font-semibold text-center mb-2">Live Shoppable Products</h2>
    <div id="reels-feed" class="reel-container rounded-xl shadow-lg bg-black relative">
      <div class="p-8 text-center text-white">Loading dynamic feed from database...</div>
    </div>
  </section>

  <!-- Section 2: Subscriptions -->
  <section id="pricing-section" class="hidden max-w-4xl mx-auto my-8 p-4">
    <h2 class="text-2xl font-bold text-center mb-6">Choose Your Subscription Tier</h2>
    <div class="grid md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl shadow-md border-2 border-gray-200">
        <h3 class="text-xl font-bold text-gray-800">Buyer Subscription</h3>
        <p class="text-gray-500 text-sm mt-1">For regular marketplace shoppers</p>
        <p class="text-3xl font-extrabold mt-4">$4.99 <span class="text-base font-normal text-gray-500">/ mo</span></p>
        <button class="mt-6 w-full bg-black text-white font-bold py-2 rounded-lg">Subscribe as Buyer</button>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-md border-2 border-amber-500">
        <h3 class="text-xl font-bold text-gray-800">Pro Seller / Store Plan</h3>
        <p class="text-gray-500 text-sm mt-1">For vendors & freelancers</p>
        <p class="text-3xl font-extrabold mt-4">$15.00 <span class="text-base font-normal text-gray-500">/ mo</span></p>
        <button class="mt-6 w-full bg-amber-500 text-black font-bold py-2 rounded-lg">Upgrade to Pro Store</button>
      </div>
    </div>
  </section>

  <!-- Payment Modal -->
  <div id="paynow-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 rounded-xl max-w-sm w-full">
      <h3 class="text-lg font-bold mb-2">Checkout with Paynow</h3>
      <p id="modal-item-details" class="text-sm text-gray-600 mb-4"></p>
      <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">EcoCash Phone Number</label>
      <input type="text" id="ecocash-number" placeholder="077XXXXXXX" class="w-full p-2 border border-gray-300 rounded mb-4">
      <div class="flex space-x-2">
        <button onclick="processMobilePayment()" class="w-full bg-green-600 text-white font-bold py-2 rounded">Pay EcoCash</button>
        <button onclick="closePaynowModal()" class="w-full bg-gray-300 text-gray-700 font-bold py-2 rounded">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kuvorxkuyijvntyrsdks.supabase.co";
    
    // Paste your publishable key inside the quotes below
    const SUPABASE_ANON_KEY = "sb_publishable_t-TmErHKkg9Cv2wZ94IKKw_cvXAYgUD";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProductsFromDB() {
      const feed = document.getElementById('reels-feed');
      
      const { data: products, error } = await supabaseClient
        .from('products')
        .select('*');

      if (error || !products || products.length === 0) {
        feed.innerHTML = `
          <div class="reel-card relative flex items-center justify-center bg-gray-800 text-white">
            <video class="w-full h-full object-cover" autoplay loop muted playsinline src="https://assets.mixkit.co/videos/preview/mixkit-shoes-in-a-store-42998-large.mp4"></video>
            <div class="absolute bottom-4 left-4 right-4 bg-black/70 p-4 rounded-lg flex justify-between items-center">
              <div>
                <span class="bg-amber-500 text-black text-xs font-bold px-2 py-0.5 rounded">PRO SELLER</span>
                <h3 class="font-bold text-white text-md mt-1">Sneaker Hub Harare</h3>
                <p class="text-lg font-extrabold text-amber-400">$45.00 USD</p>
              </div>
              <button onclick="triggerPaynowModal('Sneaker Hub', 45)" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg">Buy Now</button>
            </div>
          </div>`;
        return;
      }

      feed.innerHTML = products.map(item => `
        <div class="reel-card relative flex items-center justify-center bg-gray-800 text-white">
          <video class="w-full h-full object-cover" autoplay loop muted playsinline src="${item.video_url || 'https://assets.mixkit.co/videos/preview/mixkit-shoes-in-a-store-42998-large.mp4'}"></video>
          <div class="absolute bottom-4 left-4 right-4 bg-black/70 p-4 rounded-lg flex justify-between items-center">
            <div>
              <h3 class="font-bold text-white text-md">${item.title}</h3>
              <p class="text-sm text-gray-300">${item.description || ''}</p>
              <p class="text-lg font-extrabold text-amber-400">$${item.price} ${item.currency}</p>
            </div>
            <button onclick="triggerPaynowModal('${item.title}', ${item.price})" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg">Buy Now</button>
          </div>
        </div>
      `).join('');
    }

    function switchTab(tabName) {
      document.getElementById('reels-section').classList.add('hidden');
      document.getElementById('pricing-section').classList.add('hidden');
      if (tabName === 'reels') document.getElementById('reels-section').classList.remove('hidden');
      if (tabName === 'pricing') document.getElementById('pricing-section').classList.remove('hidden');
    }

    function triggerPaynowModal(itemTitle, price) {
      document.getElementById('modal-item-details').innerText = `Item: ${itemTitle} | Total: $${price}.00 USD`;
      document.getElementById('paynow-modal').classList.remove('hidden');
    }

    function closePaynowModal() {
      document.getElementById('paynow-modal').classList.add('hidden');
    }

    function processMobilePayment() {
      const phone = document.getElementById('ecocash-number').value;
      if(!phone) { alert('Please enter a valid phone number'); return; }
      alert(`Payment prompt sent to ${phone}. Check your phone to complete the PIN authorization.`);
      closePaynowModal();
    }

    loadProductsFromDB();
  </script>
</body>
</html>
